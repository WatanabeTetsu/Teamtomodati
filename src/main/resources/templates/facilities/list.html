<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" type="text/css" href="../../static/css/style.css" th:href="@{/css/style.css}" />
    <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/5.3.5/css/bootstrap.min.css}" />
    <meta charset="UTF-8" />
    <title>設備登録一覧画面</title>
</head>
<body>
    <p>
        <span sec:authentication="principal.user.username">duke</span>さんログイン中。
    </p>
    <form th:action="@{/logout}" method="post">
        <input type="submit" class="btn btn-default btn-xs" value="ログアウト" />
    </form>

    <form th:action="@{/facilities/create}" th:object="${facilityForm}" method="post">
        <table class="table table-striped table-bordered table-condensed">
            <tr>
                <td>機種カテゴリ:</td>
                <td>
                    <input type="text" name="name" th:field="*{name}" th:errorclass="error-input" />
                    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error-messages">error!</span>
                </td>
            </tr>
            <tr>
                <td>型番：</td>
                <td>
                    <input type="text" name="modelNumber" th:field="*{modelNumber}" th:errorclass="error-input" />
                    <span th:if="${#fields.hasErrors('modelNumber')}" th:errors="*{modelNumber}" class="error-messages">error!</span>
                </td>
            </tr>
            <tr>
                <td>設置場所：</td>
                <td>
                    <input type="text" name="location" th:field="*{location}" />
                </td>
            </tr>
            <tr>
                <td>費用：</td>
                <td>
                    <input type="text" name="cost" th:field="*{cost}" th:errorclass="error-input" />
                    <span th:if="${#fields.hasErrors('cost')}" th:errors="*{cost}" class="error-messages">error!</span>
                </td>
            </tr>
        </table>
        <input type="submit" value="作成" />
    </form>

    <hr />

    <table>
        <tr th:each="facility : ${facilities}">
            <td th:text="${facility.id}">100</td>
            <td th:text="${facility.name}">機種カテゴリA</td>
            <td th:text="${facility.modelNumber}">型番A</td>
            <td th:text="${facility.location}">設置場所A</td>
            <td th:text="${facility.cost}">100</td>
            <td>
                <form th:action="@{/facilities/edit}" method="post">
                    <input type="submit" name="form" value="編集" />
                    <input type="hidden" name="id" th:value="${facility.id}" />
                </form>
            </td>
            <td>
                <form th:action="@{/facilities/delete}" method="post">
                    <input type="submit" name="form" value="削除" />
                    <input type="hidden" name="id" th:value="${facility.id}" />
                </form>
            </td>
        </tr>
    </table>
</body>
</html>
