<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" type="text/css" href="../../static/css/style.css" th:href="@{/css/style.css}" />
    <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/5.3.5/css/bootstrap.min.css}" />
    <meta charset="UTF-8" />
    <title>設備編集画面</title>
</head>
<body>
    <form th:action="@{/facilities/edit}" th:object="${facilityForm}" method="post">
        <table class="table table-striped table-bordered table-condensed">
            <tr>
                <td>設備名:</td>
                <td>
                    <input type="text" name="name" th:field="*{name}" th:errorclass="error-input" />
                    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error-messages">error!</span>
                </td>
            </tr>
            <tr>
                <td>管理者：</td>
                <td>
                    <input type="text" name="manager" th:field="*{manager}" />
                    <span th:if="${#fields.hasErrors('manager')}" th:errors="*{manager}" class="error-messages">error!</span>
                </td>
            </tr>
            <tr>
                <td>設置場所：</td>
                <td>
                    <input type="text" name="location" th:field="*{location}" />
                </td>
            </tr>
            <tr>
                <td>費用：</td>
                <td>
                    <input type="text" name="cost" th:field="*{cost}" />
                    <span th:if="${#fields.hasErrors('cost')}" th:errors="*{cost}" class="error-messages">error!</span>
                </td>
            </tr>
        </table>
        <input type="hidden" name="id" th:value="${param.id[0]}" />
        <input type="submit" name="goToTop" value="戻る" />
        <input type="submit" value="更新" />
    </form>
</body>
</html>
